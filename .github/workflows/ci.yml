name: CI

# Every push and pull request is typechecked, tested and built — the same
# `npm run verify` that `vscode:prepublish` runs, so nothing that fails here
# can be published.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run verify
      - run: npm run build
